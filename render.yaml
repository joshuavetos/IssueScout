services:
  - type: web
    name: issue-scout-spike
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: issue-scout-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_GITHUB_USER_ID
        value: "211133238"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false

databases:
  - name: issue-scout-db
    plan: basic-256mb
